

name: Build Gdylet APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract and build
        shell: bash
        run: |
          set -e
          mkdir extracted
          unzip -q "Гдулет .zip" -d extracted
          SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project directory: $PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gdylet-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

