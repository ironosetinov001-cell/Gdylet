
name: Build Gdylet APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project archive
        run: |
          unzip "Гдулет .zip" -d extracted
          PROJECT_DIR=$(find extracted -type f -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -n "$PROJECT_DIR"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gdylet-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
